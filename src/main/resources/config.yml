# Auto update from Guizhan Build is enabled by default.
auto-update: true

# Language
language: zh-CN

# Do not change this value unless you know what you are doing.
config-version: 2.1.68

# Do not change this value unless you know what you are doing.
debug: false

grid-new-style-max-custom-amount: 2304

use-bukkit-item-comparison: false

ban-quantum-in-quantum: false

drawer-auto-save-period: 300

disable-profile-check: false

fast-interact-quantum: true

# 拼音搜索开关：关闭后物品搜索仅匹配原文名，不再做拼音/拼音首字母匹配（省去 pinyin 库的运行时开销）。
enable-pinyin-search: true

# 元件网络设置
cellnet:
  # 元件可升级到的物品种类上限。新元件初始1种,每个量子储存+1,直至此上限。
  max-item-types: 64
  # 装配驱动器批量取料：开启后一轮短缺材料合并为一次网络走查（扣货来源顺序可能与旧版不同，取料总量不变）。
  # 关闭则走旧的逐材料路径，异常时可随时关闭回滚。
  assembly-batch-fetch: true

# 元件网络持久化 (SQLite)
cellnet-storage:
  wal-mode: true
  busy-timeout: 5000
  write-timeout-seconds: 10
  journal-retention-minutes: 30
  archive-enabled: true
  archive-retention-days: 7
  archive-max-rows: 2000000
  checkpoint-interval: 60
  checkpoint-threshold: 5000
  backup-enabled: true
  backup-interval-hours: 24
  # 备份保留份数，超出后从最旧开始删除；<= 0 表示不清理
  backup-keep: 10

rpg-fix:
  force-check-lore: false

speed-up:
  persistent-threshold: 15
  cache-miss-threshold: 15
  soft-cell-ban: false
  soft-cell-ban-threshold: 0

speed-down:
  transport-miss-threshold: 120
  reduce-ms: 8000

# 链式传输框架: base-distance 基础距离(格), distance-per-module 距离模块加成,
# max-distance 距离硬上限, cache-ttl-ticks 目标缓存存活(SF Tick), idle-ttl-ticks 空线休眠存活
# 模板槽固定: 基础 3 格, 扩容模块每片 +3 格, 最多 9 格(不可配置)
# work-interval-seconds 工作间隔(秒)。0=满效率(默认); 填 1~60 则每 N 秒工作一次
chain:
  base-distance: 16
  distance-per-module: 16
  max-distance: 64
  cache-ttl-ticks: 40
  idle-ttl-ticks: 200
  work-interval-seconds: 0

# 网络符文[收纳]: 用符文合成后的武器工具打怪挖矿，掉落物收进绑定的网络
collect-rune:
  enabled: true

record-gc:
  threshold: 131072
  deadline: 120000 # milliseconds

# max-distance means the max distance that the transfer can access. Unit: Block
# pushitem-tick means the interval time to push. Unit: SF Tick
# grabitem-tick means the interval time to grab. Unit: SF Tick
